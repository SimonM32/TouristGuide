<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>EditAttraction</title>
</head>
<body>

<h1> Opdater Tourist attraktion</h1>

<form th:action="@{/update}" th:object="${editedAttraction}" method="POST">

    <input type="hidden" th:name="oldName" th:value="${editedAttraction.name}">

    <label for="name" >Navn: </label>
    <input type="text" id="name" th:field="*{name}">
    <br>
    <label for="description"> Beskrivelse: </label>
    <textarea id="description" th:field="*{description}"></textarea>
    <br>
    <label for="city"> By: </label>
    <select id="city" th:field="*{city}">
        <option th:each="c : ${allCities}" th:value="${c}" th:text="${c}"></option>
    </select>
    <br>
    <label for="tag" th:each="t : ${allTags}">
    <input type="checkbox" id="tag" th:field="*{tags}" th:text="${t}" th:value="${t}">
    </label>
    <br>
    <button type="submit"> Opdater </button>
</form>

</body>
</html>
