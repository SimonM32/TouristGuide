# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - touristguidenapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
      DEV_DB_USERNAME: ${{ secrets.DEV_DB_USERNAME }}
      DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java 21
      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      # Build application and run tests
      - name: Build with Maven
        run: mvn clean install

      # Display test reports even if Maven fails
      - name: Display test reports
        if: always()
        run: |
          echo "===== Surefire Reports ====="

          if [ -d target/surefire-reports ]; then
            echo "===== Available Report Files ====="
            find target/surefire-reports -maxdepth 1 -type f -print

            echo "===== Test Error Details ====="
            for file in target/surefire-reports/*.txt; do
              if [ -f "$file" ]; then
                echo "================================"
                echo "FILE: $file"
                cat "$file"
              fi
            done
          else
            echo "No Surefire reports found."
          fi

      # Upload test reports even if tests fail
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

     
