<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>attractionList</title>
    <link rel="stylesheet" th:href="@{/attractionListStyle.css}">
</head>
<body>

<h1 class="text">Tourist Attractions</h1>

<table>
    <thead>
    <tr>
        <th>Attraction</th>
        <th>Description</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="touristAttraction: ${attractions}">
        <td th:text="${touristAttraction.name}"></td>
        <td th:text="${touristAttraction.description}"></td>
        <td>
            <form th:action="@{/attractions/{name}/tags (name=${touristAttraction.name})}" method="GET">
                <button type="submit"> Tag</button> <!-- Måske OGSÅ ændre knappen til a href link til ny hjemmeside -->
            </form>
        </td>
        <td>
            <form th:action="@{/attractions/{name}/delete (name=${touristAttraction.name})}" method="POST"
            onsubmit="return confirm('er du sikker på at du vil slette attraktionen?')">
                <button type="submit"> Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<br>
<div class="button-row">
<a th:href="@{/add}" class="button"> Tilføj Attraktion</a> <!-- Class button styling gider ikke at virke-->
</div>
</body>
</html>
