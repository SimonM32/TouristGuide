<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>attractionList</title>
    <link rel="stylesheet" th:href="@{/attractionListStyle.css}">
</head>
<body>

<h1 class="text">Tourist Attractions</h1>

<table>
    <thead>
    <tr>
        <th>Attraction</th>
        <th>Description</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="touristAttraction: ${attractions}">
        <td th:text="${touristAttraction.name}"></td>
        <td th:text="${touristAttraction.description}"></td>
        <td>
            <form th:action="@{/attractions/{name}/tags (name=${touristAttraction.name})}" method="GET">
                <button type="submit"> Tag</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<br>

<button type="submit">Tilføj attraktion</button>

</body>
</html>
