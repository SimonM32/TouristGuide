<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title> addAttraction</title>
    <link rel="stylesheet" th:href="@{/addAttraction.css}">
</head>
<body>

<h1> Tilføj turistattraktion </h1>

<form  th:object="${addedAttraction}">
    <label for="1"> Navn: </label>
    <input type="text" id="1" th:field="*{name}"/>
<br>
    <label for="2"> Beskrivelse: </label>
    <textarea id="2" th:fiels="*{description}"></textarea>
<br>
    <label for="3"> By: </label>
    <select id="3" th:field="*{city}">
        <option value=""> Vælg byen</option>
        <option value="København"> København </option>
        <option value="Aarhus"> Aarhus </option>
        <option value="Aalborg"> Aalborg </option>
    </select>
<br>
    <label for="4"> Tags: </label>
    <input type="checkbox" id="4" th:field="*{tags}">
<br>
    <button type="submit"> OK </button>
    <button type="submit"> Fortryd </button>  <!-- Måske ændre til link a href tilbage til den forrige hjemmeside  -->


</form>

</body>
</html>
